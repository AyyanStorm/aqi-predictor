version: '3.9'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - aqi-api

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - prometheus

  aqi-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aqi-api
    ports:
      - "8000:8000"
    environment:
      - HOPSWORKS_API_KEY=${HOPSWORKS_API_KEY}
      - HOPSWORKS_PROJECT=${HOPSWORKS_PROJECT}
      - HOPSWORKS_HOST=${HOPSWORKS_HOST:-eu-west.cloud.hopsworks.ai}
      - HOPSWORKS_PORT=${HOPSWORKS_PORT:-443}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - aqi-dashboard
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  aqi-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: aqi-dashboard
    ports:
      - "8501:8501"
    environment:
      - HOPSWORKS_API_KEY=${HOPSWORKS_API_KEY}
      - HOPSWORKS_PROJECT=${HOPSWORKS_PROJECT}
      - HOPSWORKS_HOST=${HOPSWORKS_HOST:-eu-west.cloud.hopsworks.ai}
      - HOPSWORKS_PORT=${HOPSWORKS_PORT:-443}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLECORS=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.streamlit:/app/.streamlit
    networks:
      - aqi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  aqi-network:
    driver: bridge

volumes:
  aqi-data:
    driver: local
  aqi-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
