# Render blueprint — Production-grade deployment with monitoring
# Dashboard (Streamlit) + API (FastAPI) with comprehensive monitoring & reliability
# Docs: https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Push this file to main.
#   2. Render dashboard → New → Blueprint → select aqi-predictor repo.
#   3. Set HOPSWORKS_API_KEY and SENTRY_DSN as secret env vars on both services.
#   4. Render builds both services and gives you public HTTPS URLs.
#
# Production Features:
#   ✅ Health checks every 30s (uptime monitoring)
#   ✅ Sentry integration (error tracking)
#   ✅ Structured JSON logging
#   ✅ Prometheus metrics (/metrics endpoint)
#   ✅ Rate limiting (200/hour default)
#   ✅ Request tracing (request_id)
#   ✅ Zero-downtime deployments (auto)
#   ✅ Graceful shutdown (30s drain)

services:
  - type: web
    name: aqi-api
    runtime: python
    plan: standard  # Use standard for production reliability
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT --workers 4 --loop uvloop
    healthCheckPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 10
    maxInstances: 3  # Auto-scale up to 3 instances under load
    memoryMB: 1024   # 1GB RAM per instance
    envVars:
      - key: HOPSWORKS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false  # Critical secret - set in Render dashboard only
      - key: ENVIRONMENT
        value: production
      - key: SLOWAPI_ENABLED
        value: "true"  # Enable rate limiting in production
      - key: API_VERSION
        value: "1.0.0"
    routes:
      - path: /health
        priority: 1  # Health checks always succeed first
      - path: /metrics
        priority: 2  # Monitoring endpoints high priority
      - path: /api
        priority: 3  # Main API endpoints

  - type: web
    name: aqi-dashboard
    runtime: python
    plan: standard  # Use standard for production reliability
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /healthz
    memoryMB: 1024   # 1GB RAM
    envVars:
      - key: HOPSWORKS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: AQI_API_URL
        value: https://aqi-api-XXXX.onrender.com  # Update with your API URL

# Database backups (optional - for production data persistence)
