# CI — run the unit test suite on every push and pull request.
#
# The three existing workflows are the DATA pipelines (feature ingest,
# backfill, training). This one is the CODE gate: it fails the build if
# any unit test breaks, so a bad commit never reaches the deployed
# dashboard. Lightweight on purpose — tests are mocked (no network,
# no Hopsworks), so the whole run finishes in ~2 minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Verify app imports (syntax gate)
        run: |
          python -c "import app.api; import app.streamlit_app; print('app imports OK')"
