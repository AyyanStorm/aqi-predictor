name: Production Health Monitoring

on:
  schedule:
    # Run every 5 minutes for continuous monitoring
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Check API Health
        run: |
          for attempt in {1..3}; do
            echo "Health check attempt $attempt..."
            RESPONSE=$(curl -s -w "\n%{http_code}" https://aqi-api.onrender.com/health)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API healthy (status: $HTTP_CODE)"
              echo "$BODY" | jq .
              exit 0
            fi
            
            if [ $attempt -lt 3 ]; then
              sleep 10
            fi
          done
          
          echo "❌ API health check failed"
          exit 1
      
      - name: Check Dashboard Health
        if: always()
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aqi-dashboard.onrender.com)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "405" ]; then
            echo "✅ Dashboard healthy (status: $HTTP_CODE)"
            exit 0
          else
            echo "❌ Dashboard unhealthy (status: $HTTP_CODE)"
            exit 1
          fi
      
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 Production health check failed at ' + new Date().toISOString()
            })
