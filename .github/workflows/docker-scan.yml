name: Docker Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile*'
      - 'requirements.txt'
      - 'requirements-feature-store.txt'
      - '.github/workflows/docker-scan.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'requirements.txt'
      - 'requirements-feature-store.txt'

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - {file: 'Dockerfile.api', image: 'aqi-api:scan', context: '.'}
          - {file: 'Dockerfile.dashboard', image: 'aqi-dashboard:scan', context: '.'}
          - {file: 'Dockerfile.pipeline', image: 'aqi-pipeline:scan', context: '.'}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.dockerfile.file }} image
        uses: docker/build-push-action@v5
        with:
          file: ${{ matrix.dockerfile.file }}
          context: ${{ matrix.dockerfile.context }}
          push: false
          load: true
          tags: ${{ matrix.dockerfile.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan on ${{ matrix.dockerfile.file }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.dockerfile.image }}
          format: 'sarif'
          output: 'trivy-${{ matrix.dockerfile.file }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.dockerfile.file }}.sarif'
          category: 'trivy-${{ matrix.dockerfile.file }}'

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    
    steps:
      - name: Scan complete
        run: |
          echo "✅ Docker security scan completed"
          echo "All Dockerfiles scanned for vulnerabilities (CRITICAL/HIGH)"
          echo "Results available in GitHub Security tab under Code scanning"
