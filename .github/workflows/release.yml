name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags: v0.1.0, v0.2.0, etc.

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine
      
      - name: Build distributions
        run: |
          python -m build
      
      - name: Check distributions with Twine
        run: |
          twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-package-distributions
          path: dist/
  
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/project/aqi-predictor/
    
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v3
        with:
          name: python-package-distributions
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
  
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download distributions
        uses: actions/download-artifact@v3
        with:
          name: python-package-distributions
          path: dist/
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"
      
      - name: Generate release notes from CHANGELOG
        id: release-notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Extract changelog section for this version
          sed -n "/^## \[${VERSION#v}\]/,/^## \[/p" CHANGELOG.md | head -n -1 > release_notes.md
          echo "📝 Release notes extracted from CHANGELOG.md"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  docker-push:
    name: Push Docker Images
    needs: build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dockerfile:
          - name: api
            file: Dockerfile.api
            platforms: linux/amd64,linux/arm64
          - name: dashboard
            file: Dockerfile.dashboard
            platforms: linux/amd64,linux/arm64
          - name: pipeline
            file: Dockerfile.pipeline
            platforms: linux/amd64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/aqi-predictor-${{ matrix.dockerfile.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.dockerfile.file }}
          platforms: ${{ matrix.dockerfile.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/aqi-predictor-${{ matrix.dockerfile.name }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  notify:
    name: Notify Release
    needs: [build, publish, github-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check release status
        run: |
          echo "🎉 Release pipeline completed!"
          echo "Version: ${{ github.ref_name }}"
          echo "Status: ${{ needs.publish.result }}"
      
      - name: Comment on related PRs
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const version = context.ref.replace('refs/tags/', '');
            const message = `🎉 Released in ${version}`;
            console.log(message);
