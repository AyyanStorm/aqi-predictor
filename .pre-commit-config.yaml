# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files
# https://pre-commit.com

repos:
  # Python code formatter (Black)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10
        args: ['--line-length=100']

  # Python linter (Flake8)
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        additional_dependencies: ['flake8-bugbear', 'flake8-comprehensions']

  # Python type checker (MyPy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: ['--ignore-missing-imports', '--warn-unused-ignores']
        additional_dependencies:
          - 'types-requests'
          - 'types-pyyaml'
          - 'types-python-dateutil'
        exclude: 'tests/'

  # Python import sorting (isort)
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Fix trailing whitespace
      - id: trailing-whitespace
        args: ['--markdown-args=--markdown-args=keep_old_attributes']
      
      # Ensure files end with newline
      - id: end-of-file-fixer
      
      # Check YAML syntax
      - id: check-yaml
        args: ['--unsafe']
      
      # Check JSON syntax
      - id: check-json
      
      # Check for merge conflicts
      - id: check-merge-conflict
      
      # Prevent large files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']
      
      # Fix byte order markers
      - id: fix-byte-order-marker
      
      # Check for private keys
      - id: detect-private-key

  # Python security linter (Bandit)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-c', '.bandit', '-r', 'src/', 'app/']
        exclude: 'tests/'

# Exclude certain files/directories from pre-commit checks
exclude: |
  (?x)^(
    venv/|
    .venv/|
    dist/|
    build/|
    \.eggs/|
    \.git/|
    __pycache__/|
    \.pytest_cache/|
    data/
  )
