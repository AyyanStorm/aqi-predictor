# docker-compose-monitoring.yml — Prometheus + Grafana stack (Issue #35)
#
# Provides:
# - Prometheus: time-series metrics database (port 9090)
# - Grafana: dashboards and alerting UI (port 3000)
#
# Usage:
#   docker-compose -f docker-compose-monitoring.yml up -d
#
# Then:
# - Prometheus: http://localhost:9090
# - Grafana: http://localhost:3000 (admin:admin)

version: '3.8'

services:
  # Prometheus: scrapes metrics from /metrics endpoint
  prometheus:
    image: prom/prometheus:latest
    container_name: aqi-prometheus
    ports:
      - '9090:9090'
    volumes:
      # Mount prometheus.yml configuration
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mount alerting rules
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      # Persist time-series data
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # Keep 30 days of data
    environment:
      - TZ=UTC
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana: dashboard UI
  grafana:
    image: grafana/grafana:latest
    container_name: aqi-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
      - TZ=UTC
    volumes:
      # Persist Grafana configuration and dashboards
      - grafana_data:/var/lib/grafana
      # Mount provisioning configs (optional, for auto-datasource setup)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

  # Optional: Alertmanager for alert routing (not used yet, but configured)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: aqi-alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
